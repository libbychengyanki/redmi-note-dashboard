<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDMI Note 15 全球价格看板</title>
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e4e6eb;
    --text: #1a1a2e;
    --text2: #6b7280;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --accent-light: #eff6ff;
    --green: #059669;
    --red: #dc2626;
    --orange: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 12px;
    --radius-sm: 8px;
  }
  .dark {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --accent: #60a5fa;
    --accent2: #93c5fd;
    --accent-light: #1e293b;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
   * { margin:0; padding:0; box-sizing:border-box; }
   button.region-tab,
   button.model-chip,
   button.filter-chip,
   button.collapse-toggle,
   .table-sort {
     font:inherit; line-height:inherit; text-align:inherit;
   }
   .table-sort {
     appearance:none; border:0; background:transparent; color:inherit; cursor:pointer; padding:0;
   }
   button.region-tab:focus-visible,
   button.model-chip:focus-visible,
   button.filter-chip:focus-visible,
   button.collapse-toggle:focus-visible,
   .table-sort:focus-visible {
     outline:2px solid var(--accent); outline-offset:2px;
   }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height:1.5;
    transition: background .3s, color .3s;
    padding: 20px;
  }
  .container { max-width:1400px; margin:0 auto; }

  /* Header */
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .header h1 { font-size:24px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .header h1 span { background:var(--accent); color:#fff; font-size:14px; padding:2px 10px; border-radius:20px; font-weight:500; }
  .theme-toggle { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 16px; cursor:pointer; color:var(--text); font-size:14px; }
  .theme-toggle:hover { background:var(--surface2); }


  /* Controls */
  .controls { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .controls .search-wrap { flex:1; min-width:200px; }
  .controls .search-wrap input, .controls .search-wrap select {
    width:100%; padding:8px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:14px; outline:none;
  }
  .controls .search-wrap input:focus, .controls .search-wrap select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .controls .search-wrap select { cursor:pointer; appearance:auto; }
  .region-tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .region-tab {
    padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text2); font-size:13px; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .region-tab:hover { border-color:var(--accent); color:var(--accent); }
  .region-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .model-chips { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px; }
  .model-chip {
    padding:4px 12px; border-radius:16px; border:1px solid var(--border); background:var(--surface);
    color:var(--text2); font-size:12px; cursor:pointer; transition:all .15s;
  }
  .model-chip:hover { border-color:var(--accent); color:var(--accent); }
  .model-chip.active { background:var(--accent-light); color:var(--accent); border-color:var(--accent); font-weight:600; }

  /* Stats bar */
  .stats-bar { font-size:13px; color:var(--text2); margin-bottom:12px; display:flex; gap:16px; flex-wrap:wrap; }

  /* Table */
  .table-wrap { position:relative; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { background:var(--surface2); font-weight:600; color:var(--text2); font-size:12px; cursor:pointer; user-select:none; position:relative; }
  th:hover { color:var(--text); }
  th .sort-icon { opacity:.3; margin-left:4px; }
  th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity:1; }
  th.sort-asc .sort-icon::after { content:'▲'; font-size:10px; }
  th.sort-desc .sort-icon::after { content:'▼'; font-size:10px; }
  th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content:'↕'; font-size:10px; }
  tr:hover { background:var(--accent-light); }
  td:first-child { font-weight:600; }
  td .region-badge {
    display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px;
    background:var(--accent-light); color:var(--accent); font-weight:500;
  }
  td .price { font-variant-numeric:tabular-nums; }
td .price.missing { color:var(--text2); font-style:italic; }
.gap-status { display:inline-block; color:var(--text2); font-size:12px; font-weight:600; }
.gap-status.blocked { color:var(--red); }
.gap-status.not_listed { color:var(--orange); }
  .quality-badge { font-size:11px; padding:1px 8px; border-radius:10px; }
  .quality-badge.full { background:#ecfdf5; color:#059669; }
  .quality-badge.partial { background:#fffbeb; color:#d97706; }
  .quality-badge.limited { background:#fef2f2; color:#dc2626; }
  .thai-coverage { white-space:nowrap; }

  /* Chart section */
  .chart-section { margin-top:24px; }
  .chart-section h2 { font-size:18px; margin-bottom:12px; }
  .chart-card { background:var(--surface); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }

  /* Competition */
  .comp-section { margin-top:24px; }
  .comp-section h2 { font-size:18px; margin-bottom:12px; }

  /* Footer */
  .footer { margin-top:32px; padding:16px 0; text-align:center; font-size:12px; color:var(--text2); border-top:1px solid var(--border); max-width:100%; white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
  .footer-nowrap { white-space:nowrap; }

  /* Animations */
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .table-wrap, .chart-card { animation:fadeIn .4s ease; }

  /* Empty state */
  .empty-state { padding:40px; text-align:center; color:var(--text2); font-size:14px; }

  /* Section tabs */
  .section-tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--border); }
   .section-tab {
     padding:10px 20px; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none;
     background:transparent; color:var(--text2); font-size:14px; cursor:pointer; font-weight:500;
     transition:all .15s; position:relative; bottom:-2px; font-family:inherit; line-height:inherit; text-align:inherit;
  }
  .section-tab:hover { color:var(--accent); background:var(--accent-light); }
  .section-tab.active {
    background:var(--surface); color:var(--accent); border-color:var(--border); font-weight:600;
  }
  .section-tab .badge {
    font-size:11px; background:var(--accent-light); color:var(--accent); padding:0 8px; border-radius:10px; margin-left:6px;
  }
  .section-tab.active .badge { background:var(--accent); color:#fff; }

  /* Responsive */
  @media(max-width:768px) {
    .table-wrap.has-scroll-right { padding-top:28px; }
    .table-wrap.has-scroll-right::after {
      content:"\203A"; position:absolute; top:0; right:0; z-index:4; height:28px; width:40px;
      display:flex; align-items:center; justify-content:flex-end; box-sizing:border-box; padding-right:8px;
      color:#fff; font-size:24px; font-weight:700; pointer-events:none; background:var(--accent);
    }
    body { padding:12px; }
    .header h1 { font-size:18px; }
    .section-tabs { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:2px; overflow-x:visible; }
    .section-tab { min-width:0; padding:8px 4px; font-size:12px; line-height:1.25; white-space:normal; overflow-wrap:anywhere; }
    .section-tab:last-child { font-size:11px; white-space:nowrap; }
    .section-tab .badge { display:inline-block; white-space:nowrap; vertical-align:middle; padding:0 4px; margin-left:3px; font-size:10px; }
    #mainTable th:last-child { position:sticky; right:0; z-index:3; background:var(--surface2); width:176px; min-width:176px; white-space:normal; overflow-wrap:anywhere; }
    #mainTable td:last-child { position:sticky; right:0; z-index:2; background:var(--surface); width:176px; min-width:176px; white-space:normal; overflow-wrap:anywhere; }
  }

  /* History */
  /* Collapsible */
   .collapse-toggle {
     display:flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--border);
     border-radius:var(--radius-sm); background:var(--surface); color:var(--text2); font-size:13px;
     cursor:pointer; transition:all .15s; user-select:none; margin-bottom:12px; font-family:inherit; line-height:inherit; text-align:inherit;
  }
  .collapse-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .collapse-toggle .arrow { transition:transform .2s; display:inline-block; font-size:10px; }
  .collapse-toggle .arrow.open { transform:rotate(90deg); }
  .collapse-body { overflow:hidden; transition:max-height .3s ease; max-height:0; }
  .collapse-body.open { max-height:100000px; }

  /* Filter group: chip + search combo */
  .filter-group { display:flex; flex-direction:column; gap:3px; min-width:140px; }
   .filter-group label, .filter-group .filter-label { font-size:11px; color:var(--text2); font-weight:500; }
  .filter-search {
    padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:12px; outline:none; width:100%; box-sizing:border-box;
  }
  .filter-search:focus { border-color:var(--accent); }
  .filter-chips { display:flex; flex-wrap:wrap; gap:3px; max-height:80px; overflow-y:auto; padding:2px 0; }
  .filter-chip {
    padding:1px 10px; border:1px solid var(--border); border-radius:10px;
    font-size:11px; cursor:pointer; background:var(--surface); color:var(--text2);
    transition:all .12s; white-space:nowrap; user-select:none;
  }
  .filter-chip:hover { border-color:var(--accent); color:var(--accent); }
  .filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filter-chip.all-chip { border-style:dashed; opacity:.7; }
  .filter-chip.all-chip.active { border-style:solid; opacity:1; }

  .comp-filters { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:flex-start; }
  .comp-filters .stat { font-size:12px; color:var(--text2); align-self:center; margin-left:auto; white-space:nowrap; }

  .history-controls { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:flex-start; }
  .history-controls select {
    padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:13px; outline:none; cursor:pointer; min-width:120px;
  }
  .history-controls select:focus { border-color:var(--accent); }
  .trend-chart-wrap { width:100%; overflow-x:auto; padding:10px 0; }
  .trend-single {
    text-align:center; padding:40px 0;
  }
  .trend-single .big-price { font-size:48px; font-weight:700; color:var(--accent); }
  .trend-single .meta { color:var(--text2); margin-top:8px; font-size:14px; }
  .trend-single .hint {
    margin-top:24px; padding:16px; background:var(--accent-light); border-radius:8px;
    color:var(--text2); font-size:13px;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1>REDMI Note 15 全球价格看板 <span>24 国</span></h1>
    <button type="button" class="theme-toggle" onclick="toggleTheme()">🌓 深色/浅色</button>
  </div>

  <!-- Section tabs -->
  <div class="section-tabs">
    <button type="button" class="section-tab active" onclick="switchSection('overview')">📋 价格总览</button>
    <button type="button" class="section-tab" onclick="switchSection('competitor')">🏷️ 竞品价格</button>
    <button type="button" class="section-tab" onclick="switchSection('productComp')">📊 产品对标</button>
    <button type="button" class="section-tab" onclick="switchSection('history')">📈 历史趋势 <span class="badge" id="historyBadge">1</span></button>
  </div>

  <!-- Overview Section -->
  <div id="overviewSection">
  <div class="controls">
    <div class="region-tabs" id="regionTabs"></div>
    <div class="search-wrap"><select id="countrySelect" aria-label="选择国家" onchange="filterData()"><option value="">🌍 全部国家</option></select></div>
  </div>

  <div class="model-chips" id="modelChips"></div>
  <div class="stats-bar" id="statsBar"></div>

  <h2 style="font-size:16px;margin:20px 0 10px;">📋 Xiaomi REDMI Note 15 系列价格总览</h2>
  <div class="table-wrap"><table id="mainTable"><thead></thead><tbody></tbody></table></div>

  <h2 style="font-size:16px;margin:20px 0 10px;">📱 Samsung 竞品价格参考（按品类）</h2>
  <div class="table-wrap"><table id="samsungTable"><thead></thead><tbody></tbody></table></div>

  </div>

  <!-- Competitor Section -->
  <div id="competitorSection" style="display:none;">
    <!-- === PRIMARY: 竞品价格对照 (已有采集数据) === -->
    <div class="comp-section" style="margin-bottom:16px;">
      <h2 style="font-size:16px;margin-bottom:10px;">🏷️ 竞品价格对照</h2>
      <div class="comp-filters" id="compPriceFilters">
        <div class="filter-group">
          <span class="filter-label">区域</span>
          <div class="filter-chips" id="cpRegionChips"></div>
        </div>
        <div class="filter-group">
          <label for="cpCountrySearch">国家</label>
          <input class="filter-search" id="cpCountrySearch" placeholder="搜索..." oninput="filterCpChips('country')">
          <div class="filter-chips" id="cpCountryChips" style="max-height:100px;"></div>
        </div>
        <div class="filter-group">
          <label for="cpBrandSearch">竞品品牌</label>
          <input class="filter-search" id="cpBrandSearch" placeholder="搜索..." oninput="filterCpChips('brand')">
          <div class="filter-chips" id="cpBrandChips"></div>
        </div>
        <div class="filter-group">
          <label for="cpCompSearch">竞品型号</label>
          <input class="filter-search" id="cpCompSearch" placeholder="搜索..." oninput="filterCpChips('comp')">
          <div class="filter-chips" id="cpCompChips" style="max-height:100px;"></div>
        </div>
        <div class="filter-group">
          <label for="cpOurSearch">我方型号</label>
          <input class="filter-search" id="cpOurSearch" placeholder="搜索..." oninput="filterCpChips('our')">
          <div class="filter-chips" id="cpOurChips"></div>
        </div>
        <span class="stat" id="compPriceStat"></span>
      </div>
      <div class="table-wrap" style="overflow-x:auto;">
        <table id="compPriceTable"><thead></thead><tbody></tbody></table>
      </div>
    </div>

    <!-- === SECONDARY: 竞品列表 (可折叠) === -->
    <button type="button" class="collapse-toggle" aria-controls="compMappingBody" aria-expanded="false" onclick="toggleCollapse(this)">
      <span class="arrow">▶</span> 竞品国家分布映射
      <span style="font-size:12px;color:var(--text2);" id="compMappingCount"></span>
    </button>
    <div class="collapse-body" id="compMappingBody" hidden>
      <div class="model-chips" id="compProductChips" style="margin-bottom:6px;margin-top:10px;"></div>
      <div class="region-tabs" id="compRegionTabs" style="margin-bottom:6px;"></div>
      <div class="controls" style="gap:8px;margin-bottom:6px;">
        <div class="search-wrap" style="flex:0 0 200px;">
          <input id="compSearchInput" aria-label="筛选国家" placeholder="筛选国家..." oninput="renderCompMapping()">
        </div>
      </div>
      <div class="model-chips" id="compBrandChips" style="margin-bottom:8px;padding-left:2px;"></div>
      <div class="table-wrap"><table id="compMappingTable"><thead></thead><tbody></tbody></table></div>
    </div>
  </div>

  <!-- Product-Comp Section -->
  <div id="productCompSection" style="display:none;">
    <div class="controls" style="margin-bottom:8px;">
      <div class="region-tabs" id="pcRegionTabs"></div>
    </div>
    <div class="comp-filters" style="margin-bottom:8px;gap:6px;">
      <div class="filter-group" style="flex:1;">
        <span class="filter-label">竞品品牌</span>
        <div class="filter-chips" id="pcBrandChips"></div>
      </div>
      <div class="filter-group" style="flex:1;">
        <label for="pcCompSearch">竞品型号</label>
        <input class="filter-search" id="pcCompSearch" placeholder="搜索..." oninput="filterPcChips('comp')">
        <div class="filter-chips" id="pcCompChips" style="max-height:100px;"></div>
      </div>
      <div class="filter-group" style="flex:1;">
        <label for="pcCountrySearch">国家</label>
        <input class="filter-search" id="pcCountrySearch" placeholder="搜索..." oninput="filterPcChips('country')">
        <div class="filter-chips" id="pcCountryChips" style="max-height:100px;"></div>
      </div>
      <span class="stat" id="pcFilterStat"></span>
    </div>
    <div class="stats-bar" id="pcStatsBar" style="margin-bottom:12px;"></div>
    <div id="productCompContainer"></div>
  </div>

  <!-- History Section -->
  <div id="historySection" style="display:none;">
    <div class="region-tabs" id="historyRegionTabs" style="margin-bottom:8px;"></div>
    <div class="history-controls">
      <div class="filter-group" style="min-width:160px;">
        <label for="historyCountrySearch">国家</label>
        <input class="filter-search" id="historyCountrySearch" placeholder="搜索..." oninput="filterHistoryChips()">
        <div class="filter-chips" id="historyCountryChips" style="max-height:100px;"></div>
      </div>
      <select id="historyModel" aria-label="选择型号" onchange="renderHistoryChart()">
        <option value="">选择型号</option>
      </select>
      <span style="font-size:13px;color:var(--text2);" id="historySnapshotsCount"></span>
    </div>

    <div class="chart-section">
      <h2>📈 价格趋势 (USD)</h2>
      <div class="chart-card" style="position:relative;">
        <div id="trendChartContainer" class="trend-chart-wrap"></div>
        <div id="trendEmpty" class="empty-state" style="display:block;">选择国家和型号查看价格趋势</div>
      </div>
    </div>

    <div class="chart-section">
      <h2>📸 数据快照</h2>
      <div class="table-wrap"><table id="historyTable"><thead>
        <tr><th>日期</th><th>版本</th><th>备注</th><th>覆盖国家</th></tr>
      </thead><tbody></tbody></table></div>
    </div>
  </div>

  <div class="footer">
    <button type="button" class="collapse-toggle" aria-controls="qualityPanelBody" aria-expanded="false" onclick="toggleCollapse(this)" style="margin-bottom:8px;font-size:13px;color:var(--text2);cursor:pointer;display:inline-block;">
      <span class="arrow">▶</span> 数据质量（点击展开/折叠）
    </button>
    <div class="collapse-body" id="qualityPanelBody" hidden style="margin-bottom:12px;">
      <div id="qualityPanel" style="font-size:12px;color:var(--text2);"></div>
    </div>
    <button type="button" class="collapse-toggle" aria-controls="exchangeRatePanelBody" aria-expanded="false" onclick="toggleCollapse(this)" style="margin-bottom:8px;font-size:13px;color:var(--text2);cursor:pointer;display:inline-block;">
      <span class="arrow">▶</span> 汇率参考（点击展开/折叠）
    </button>
    <div class="collapse-body" id="exchangeRatePanelBody" hidden style="margin-bottom:12px;">
      <div id="exchangeRatePanel" style="font-size:12px;color:var(--text2);"></div>
    </div>
    数据来源: 各国指定零售渠道官网
  </div>
</div>

<script>
// ===== DATA =====
const REGIONS = ['全部','拉美','独联体','西欧','东北欧','东南亚','中东','印尼','东亚','非洲'];
const MODEL_KEYS = ['REDMI Note 15','REDMI Note 15 5G','REDMI Note 15 Pro','REDMI Note 15 Pro 5G','REDMI Note 15 Pro+ 5G'];
const MODEL_COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'];

// ===== 源页面 URL 映射（价格点击跳转）=====
const SOURCE_URLS = {
  "秘鲁": {
    "Note 15|8GB+256GB|Oechsle": "https://www.oechsle.pe/redmi-note-15-4g-256gb-8ram--azul-1001876761/p",
    "Note 15 5G|8GB+256GB|Oechsle": "https://www.oechsle.pe/celular-xiaomi-redmi-note-15-5g-256gb-8gb-ram-blue-1001890994/p",
    "Note 15 Pro|8GB+256GB|Oechsle": "https://www.oechsle.pe/redmi-note-15-pro-4g-256gb-8ram-azul-glaciar--registrado-1001860833/p",
    "Note 15 Pro 5G|8GB+512GB|Oechsle": "https://www.oechsle.pe/celular-xiaomi-redmi-note-15-pro-5g-8gb-ram-512gb-rom-glacier-blue-3137280/p",

function escapeHtmlText(value) {

function normalizeChannelLabel(channel) {
  const raw = (channel || '').trim();
  if (!raw) return '';
  if (raw === 'Home Credit Shoppingmall' || raw === 'Shoppingmall') return 'Shoppingmall';
  if (raw.startsWith('Teknosa')) return 'Teknosa';
  if (raw.startsWith('Fortress')) return 'Fortress';
  if (raw.startsWith('Datart')) return 'Datart';
  if (raw === 'Pointek ✓') return 'Pointek';
  return raw;
}

function formatChannelLabels(channels, separator) {
  return [...new Set(channels.map(normalizeChannelLabel).filter(Boolean))].join(separator || ' / ');
}

function getOfferDisplayKey(row) {
  const spec = row[3] || '';
  const channelMatch = spec.match(/\(([^)]+)\)\s*$/);
  const configuration = (channelMatch ? spec.replace(/\s*\([^)]+\)\s*$/, '') : spec)
    .trim()
    .replace(/\s+/g, ' ');
  const channel = normalizeChannelLabel(channelMatch ? channelMatch[1] : '');
  return [row[1], row[2], configuration, channel, row[4], row[5]].join('|');
}

function groupDisplayOffers(rows) {
  const groups = new Map();
  rows.forEach(row => {
    const key = getOfferDisplayKey(row);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });
  return [...groups.values()];
}

function dedupeDisplayOffers(rows) {
  return groupDisplayOffers(rows).map(group => group[0]);
}

// Helper: get best USD price for a (country, model) pair
function getUsdPrice(country, modelName){
  const match = detailData.filter(d => d[0]===country && d[1]===modelName
    && !(country === '秘鲁' && /^S\/[\d,]+-[\d,]+$/.test(d[3]) && d[4] === '—'));
  if(match.length===0) return null;
  // Pick the row with the lowest price
  let best = match[0];
  for(const m of match){
    const v = parseFloat((m[4].match(/[\d.]+/)||['0'])[0]);
    const bv = parseFloat((best[4].match(/[\d.]+/)||['0'])[0]);
    if(!isNaN(v) && (isNaN(bv) || v < bv)) best = m;
  }
  // Extract first number from strings like "~244~333", "~238", "~203~214"
  const numMatch = best[4].match(/[\d.]+/);
  const usd = numMatch ? parseFloat(numMatch[0]) : NaN;
  return isNaN(usd) ? null : { usd, local: best[3], currency: best[5], config: best[2], usdDisplay: best[4].trim() };
}

function gapStatusKey(country, ownModel, competitorBrand, competitorModel) {
  return [country, ownModel, competitorBrand, canonicalizeCompetitorModel(competitorModel, competitorBrand)].join('|');
}

function gapStatusText(record) {
  return GAP_STATUS_LABELS[record.status] || record.status;
}

function gapStatusHtml(record) {
  return `<span class="gap-status ${record.status}">${gapStatusText(record)}</span>`;
}

function thailandCompetitorStatusOverlay() {
  return THAILAND_COMPETITOR_STATUS_OBSERVATIONS.map(record => {
    const competitorModel = canonicalizeCompetitorModel(record.model, record.brand);
    return {
      country: record.country,
      ownModel: '',
      competitorBrand: record.brand,
      competitorModel,
      status: record.status,
      channel: record.channel,
      key: gapStatusKey(record.country, '', record.brand, competitorModel)
    };
  });
}

async function loadCompetitorStatusOverlay() {
  const bytes = Uint8Array.from(atob(GAP_STATUS_OVERLAY_PAYLOAD), character => character.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const records = JSON.parse(await new Response(stream).text());
  return records
    .filter(([sourceCountry, , competitorBrand, competitorModel]) => !(
      sourceCountry === '尼日利亚'
      || (sourceCountry === 'Malaysia' && competitorBrand === 'OPPO' && competitorModel === 'OPPO Reno 14F')
      || (sourceCountry === 'Mexico' && (
        (competitorBrand === 'vivo' && competitorModel === 'V40 5G')
        || (competitorBrand === 'OPPO' && (competitorModel === 'A5 pro 5G' || competitorModel === 'A5 Pro'))
      ))
      || (sourceCountry === 'Russia' && competitorBrand === 'Samsung' && competitorModel === 'A17 5G')
    ))
    .map(([sourceCountry, ownModel, competitorBrand, competitorModel, status, channel]) => {
      const isRussiaHonorX7d = sourceCountry === 'Russia'
        && ownModel === 'REDMI Note 15 5G'
        && competitorBrand === 'Honor'
        && competitorModel === 'X7d 5G';
      const isMexicoA6Pro = sourceCountry === 'Mexico'
        && ownModel === 'REDMI Note 15'
        && competitorBrand === 'OPPO'
        && competitorModel === 'A6 Pro 5G';
      const country = GAP_STATUS_COUNTRY_MAP[sourceCountry] || sourceCountry;
      const mappedOwnModel = isRussiaHonorX7d
        ? 'REDMI Note 15'
        : isMexicoA6Pro
          ? 'REDMI Note 15 Pro'
          : ownModel;
      const mappedCompetitorModel = isRussiaHonorX7d
        ? 'X7d'
        : isMexicoA6Pro
          ? 'A6 Pro'
          : competitorModel;
      const canonicalCompetitorName = canonicalizeCompetitorModel(mappedCompetitorModel, competitorBrand);
      return {
        country,
        ownModel: mappedOwnModel,
        competitorBrand,
        competitorModel: canonicalCompetitorName,
        status,
        channel,
        key: gapStatusKey(country, mappedOwnModel, competitorBrand, canonicalCompetitorName)
      };
    });
}

// ===== STATE =====
function comparableModelName(model) {
  return canonicalizeCompetitorModel(model);
}

function mappedProductCodes(row) {
  const country = row[1] === '香港' ? '中国香港' : row[1];
  const sourceModel = comparableModelName(row[2]);
  return Object.entries(compMapping)
    .filter(([, countries]) => (countries[country] || []).some(model => comparableModelName(model) === sourceModel))
    .map(([code]) => code);
}

function productCodeForOwnModel(model) {
  const entries = Object.entries(PRODUCT_NAMES).sort((a, b) => b[1].length - a[1].length);
  for (const [code, name] of entries) {
    if (String(model || '').includes(name)) return code;
  }
  return null;
}

function isNotListedTarget(country, productCode) {
  const canonicalCountry = country === '香港' ? '中国香港' : country;
  const model = `REDMI ${PRODUCT_NAMES[productCode]}`;
  return NOT_LISTED_AVAILABILITY.some(record => (
    record.country === canonicalCountry
    && record.model === model
    && record.availability === 'not_listed'
  ));
}

function ownGapStatus(country, productCode) {
  const ownModel = `REDMI ${PRODUCT_NAMES[productCode]}`;
  return COMPETITOR_STATUS_OVERLAY.find(record => (
    record.country === (country === '香港' ? '中国香港' : country)
    && record.ownModel === ownModel
    && !record.competitorBrand
    && !record.competitorModel
  )) || null;
}

function comparisonGapStatus(row) {
  if (numericLocalPrice(row[4]) !== null || numericLocalPrice(row[8]) !== null) return null;
  return row[13] || COMPETITOR_STATUS_OVERLAY.find(record => (
    record.key === gapStatusKey(row[1], `REDMI ${row[6]}`, String(row[2] || '').split(' ')[0], String(row[2] || '').replace(/^\S+\s+/, ''))
  )) || null;
}

function statusOverlayRows() {
  return COMPETITOR_STATUS_OVERLAY
    .filter(record => record.competitorBrand && record.competitorModel)
    .map(record => {
      const region = summaryData.find(row => row[1] === record.country)?.[0] || '缺口状态';
      const competitorName = record.competitorModel.startsWith(`${record.competitorBrand} `)
        ? record.competitorModel
        : `${record.competitorBrand} ${record.competitorModel}`;
      const row = [
        region,
        record.country,
        competitorName,
        `状态覆盖 (${record.channel})`,
        gapStatusText(record),
        '—',
        record.ownModel ? record.ownModel.replace(/^REDMI\s+/, '') : '—',
        gapStatusText(record),
        gapStatusText(record),
        '—',
        '—',
        '',
        ''
      ];
      row[13] = record;
      return row;
    });
}

function isOwnComparisonPlaceholder(value) {
  return ['', '—', '无已验证自有价'].includes(String(value || '').trim());
}

function hasEmptyOwnComparisonField(row) {
  return row.slice(7, 10).some(isOwnComparisonPlaceholder);
}

function numericLocalPrice(value) {
  const text = String(value || '').trim();
  if (!text || text === '—' || /~|\d\s*[-–]\s*\d/.test(text)) return null;
  const amount = text.replace(/(?:HK\$|S\/|RM|CLP\$|MX\$|COP\$|\b[A-Z]{3}\b|[₸₽€$£₩฿₫₹₺₴₪₦₵₡₢₣₤₥₧₨₭₮₰₱₲₳₶₷₸₻₼₾])/g, '').replace(/\s/g, '');
  if (!/^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/.test(amount)) return null;
  const parsed = Number(amount.replace(/,/g, ''));
  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
}

function numericUsdPrice(value) {
  const text = String(value || '').trim();
  if (!/^~?\d+(?:\.\d+)?$/.test(text)) return null;
  const parsed = Number(text.replace('~', ''));
  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
}

function isVerifiedOwnCandidate(candidate) {
  const blocked = /notify\s*me|unavailable|sold[\s_-]*out|not[\s_-]*found|not_listed|not_launched|blocked|contract(?:[\s_-]*(?:only|plan|value))?|range|placeholder|pending|n\/a|无已验证自有价|不可购买|缺货|售罄|未找到|未上市|未列出/i;
  return !blocked.test([candidate.local, candidate.usdDisplay, candidate.config, candidate.evidence].join(' '))
    && numericLocalPrice(candidate.local) !== null
    && numericUsdPrice(candidate.usdDisplay) !== null
    && !isOwnComparisonPlaceholder(candidate.config);
}

function lowestLocalPrice(candidates) {
  return candidates.reduce((best, candidate) => !best || candidate.localValue < best.localValue ? candidate : best, null);
}

function recoveredOwnCandidate(country, productCode) {
  const blockedAvailability = /not_listed|not_launched|未上市|未列出/;
  if (NOT_LISTED_AVAILABILITY.some(record => (
    record.country === (country === '香港' ? '中国香港' : country)
    && record.model === `REDMI ${PRODUCT_NAMES[productCode]}`
    && blockedAvailability.test(record.availability)
  ))) return null;

  const detailCandidates = detailData
    .filter(row => row[0] === country && productCodeForOwnModel(row[1]) === productCode)
    .map(row => ({ config: row[2], local: row[3], localValue: numericLocalPrice(row[3]), usdDisplay: row[4], evidence: '', offerKey: row[6] || '' }))
    .filter(isVerifiedOwnCandidate);
  if (detailCandidates.length) return lowestLocalPrice(detailCandidates);

  const comparisonCandidates = compData
    .filter(row => row[1] === country && !hasEmptyOwnComparisonField(row) && productCodeForOwnModel(row[6]) === productCode)
    .map(row => ({ config: row[7], local: row[8], localValue: numericLocalPrice(row[8]), usdDisplay: row[9], evidence: row[10], offerKey: row[12] || '' }))
    .filter(isVerifiedOwnCandidate);
  return lowestLocalPrice(comparisonCandidates);
}

function setNoOwnPriceState(row) {
  row[7] = '无已验证自有价';
  row[8] = '无已验证自有价';
  row[9] = '—';
  row[10] = '—';
  return row;
}

function buildComparisonRows() {
  const priceRows = compData.flatMap(row => {
    const sourceCode = productCodeForOwnModel(row[6]);
    const mappedTargets = mappedProductCodes(row);
    const targets = mappedTargets.length
      ? mappedTargets
      : sourceCode && isNotListedTarget(row[1], sourceCode) ? [sourceCode] : [];
    if (!hasEmptyOwnComparisonField(row) && !(sourceCode && isNotListedTarget(row[1], sourceCode))) return [row];
    if (!targets.length) {
      const unmapped = row.slice();
      unmapped[6] = '未映射目标';
      return [setNoOwnPriceState(unmapped)];
    }
    return targets.map(code => {
      const recovered = row.slice();
      recovered[6] = PRODUCT_NAMES[code];
      if (isNotListedTarget(row[1], code)) return setNoOwnPriceState(recovered);
      const candidate = recoveredOwnCandidate(row[1], code);
      if (!candidate) return setNoOwnPriceState(recovered);
      recovered[7] = candidate.config;
       recovered[8] = candidate.local;
       recovered[9] = candidate.usdDisplay;
       recovered[12] = candidate.offerKey;
      return recovered;
    });
  });
  const coveredKeys = new Set(priceRows.map(row => {
    const record = comparisonGapStatus(row);
    if (record) row[13] = record;
    return record?.key;
  }).filter(Boolean));
  return priceRows.concat(statusOverlayRows().filter(row => !coveredKeys.has(row[13].key)));
}

function manualComparisonTargetKey(country, brand, model, ram, storage, channel) {
  return [country, brand, canonicalizeCompetitorModel(model, brand), ram, storage, channel].join('|');
}
function isDashboardOwnOffer(recordType, brand) {
  return recordType === 'own_price' || brand === 'Xiaomi';
}
let acceptedManualOffersApplied = false;

function manualPriceText(price, currency) {
  return `${MANUAL_CURRENCY_PREFIXES[currency] || ''}${price.toLocaleString('en-US')}`;
}

function manualConfigurationText(ram, storage) {
  return ram ? `${ram}+${storage}` : `未知 RAM；${storage}`;
}

function isManualOfferDisplayable(country) {
  if (country === '泰国') return true;
  const status = summaryData.find(row => row[1] === country)?.[9] || '';
  return !/\b(?:blocked|pending)\b/i.test(status);
}

function mergeSummaryVariants(existingText, manualVariants) {
  const existingVariants = existingText === '—' ? [] : existingText.split(/\s*[·/]\s*/).filter(Boolean);
  const configurationKey = (variant) => {
    const match = variant.match(/\(([^)]+)\)/);
    return match ? match[1].replace(/GB/gi, '').replace(/\s+/g, '').toLowerCase() : variant;
  };
  const variantsByConfiguration = new Map(existingVariants.map((variant) => [configurationKey(variant), variant]));
  for (const variant of manualVariants) variantsByConfiguration.set(configurationKey(variant), variant);
  return [...variantsByConfiguration.values()].join(' · ') || '—';
}

function applyAcceptedManualOffers() {
  if (acceptedManualOffersApplied) return;
  acceptedManualOffersApplied = true;
  const ownOffers = ACCEPTED_MANUAL_OFFERS.filter(([canonicalCountry, recordType, brand]) => (
    isManualOfferDisplayable(dashboardCountry(canonicalCountry)) && isDashboardOwnOffer(recordType, brand)
  ));
  for (const [canonicalCountry, , , model, ram, storage, channel, price, url] of ACCEPTED_MANUAL_OFFERS) {
    const country = dashboardCountry(canonicalCountry);
    if (!isManualOfferDisplayable(country)) continue;
    SOURCE_URLS[country] = SOURCE_URLS[country] || {};
    SOURCE_URLS[country][manualSourceKey(model, ram, storage, channel)] = url;
  }
  const offerGroups = new Map();
  for (const offer of ownOffers) {
    const country = dashboardCountry(offer[0]);
    const key = [country, offer[3]].join('|');
    offerGroups.set(key, [...(offerGroups.get(key) || []), offer]);
  }
  for (const [groupKey, offers] of offerGroups) {
    const [country, model] = groupKey.split('|');
    const [region, currency] = MANUAL_MARKET_METADATA[country];
    let summary = summaryData.find(row => row[1] === country);
    if (!summary) {
      summary = [region, country, currency, '—', '—', '—', '—', '—', '', '2026-07-31 手动核验'];
      summaryData.push(summary);
    }
    const modelIndex = MODEL_KEYS.indexOf(model);
    const variants = offers.map(([, , , , ram, storage, , price]) => `${manualPriceText(price, currency)} (${manualConfigurationText(ram, storage)})`);
    summary[modelIndex + 3] = mergeSummaryVariants(summary[modelIndex + 3], variants);
    summary[8] = formatChannelLabels(offers.map(offer => offer[6]));
    for (const [, , , , ram, storage, channel, price] of offers) {
      const configuration = `${manualConfigurationText(ram, storage)} (${channel})`;
      const detail = [country, model, configuration, manualPriceText(price, currency), `~${Math.round(price / getRate(currency))}`, currency];
      const index = detailData.findIndex(row => row[0] === country && row[1] === model && row[2].replace(/\s*\([^)]*\)\s*$/, '') === manualConfigurationText(ram, storage));
      if (index === -1) detailData.push(detail); else detailData[index] = detail;
    }
  }
  for (const [canonicalCountry, recordType, brand, model, ram, storage, channel, price] of ACCEPTED_MANUAL_OFFERS) {
    const country = dashboardCountry(canonicalCountry);
    if (isDashboardOwnOffer(recordType, brand) || !isManualOfferDisplayable(country)) continue;
    const [region, currency] = MANUAL_MARKET_METADATA[country];
    const competitor = canonicalizeCompetitorModel(model, brand);
    const targets = MANUAL_COMPARISON_TARGETS[manualComparisonTargetKey(canonicalCountry, brand, model, ram, storage, channel)] || [];
    const displayTargets = targets.length ? targets : [null];
    for (const target of displayTargets) {
      const productCode = target ? productCodeForOwnModel(target) : null;
      if (target && !productCode) continue;
      const own = productCode ? recoveredOwnCandidate(country, productCode) : null;
      const configuration = `${ram}+${storage} (${channel})`;
      if (!own && canonicalCountry !== '泰国') continue;
      const row = own
        ? [region, country, competitor, configuration, manualPriceText(price, currency), `~${Math.round(price / getRate(currency))}`, PRODUCT_NAMES[productCode], own.config, own.local, own.usdDisplay, '']
        : [region, country, competitor, configuration, manualPriceText(price, currency), `~${Math.round(price / getRate(currency))}`, productCode ? PRODUCT_NAMES[productCode] : '—', '无已验证自有价', '无已验证自有价', '—', ''];
      const key = own
        ? [country, competitor, row[3], row[4], row[6], row[7]].join('|')
        : [country, competitor, row[3], row[4], row[6]].join('|');
      const isDuplicate = candidate => (own
        ? [candidate[1], candidate[2], candidate[3], candidate[4], candidate[6], candidate[7]].join('|')
        : [candidate[1], candidate[2], candidate[3], candidate[4], candidate[6]].join('|')) === key;
      if (!compData.some(isDuplicate)) compData.push(row);
    }
  }
}

function renderTable(){
  const data = getFilteredData();
  const thead = qs('#mainTable thead');

  const modelHeaders = MODEL_KEYS.map((m,i) => {
    const colIdx = i+2;
    return `<th style="text-align:center;"${sortCol===colIdx?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}><button type="button" class="table-sort" onclick="sortTable(${colIdx})">
      ${m.replace('REDMI Note 15','Note 15')}
      <span class="sort-icon"></span></button></th>`;
  }).join('');

  thead.innerHTML = `<tr>
    <th style="text-align:left;"${sortCol===0?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}><button type="button" class="table-sort" onclick="sortTable(0)">国家<span class="sort-icon"></span></button></th>
    <th style="text-align:left;"${sortCol===1?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}><button type="button" class="table-sort" onclick="sortTable(1)">货币<span class="sort-icon"></span></button></th>
    ${modelHeaders}
  </tr>`;

  if(data.length===0){
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">无匹配数据</div></td></tr>';
    renderQualityPanel([]);
    document.getElementById('statsBar').textContent = '';
    return;
  }

  // sort
  let sorted = [...data];
  if(sortCol>=0){
    const idx = sortCol===0?1 : sortCol===1?2 : sortCol;
    sorted.sort((a,b) => {
      let va = (idx<7 ? a[idx] : a[0]);
      let vb = (idx<7 ? b[idx] : b[0]);
      // numeric attempt
      const na = parseFloat(va.replace(/[^0-9.]/g,''));
      const nb = parseFloat(vb.replace(/[^0-9.]/g,''));
      if(!isNaN(na) && !isNaN(nb)) return sortAsc ? na-nb : nb-na;
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  renderQualityPanel(sorted);
  document.getElementById('statsBar').textContent = `显示 ${sorted.length} / ${summaryData.length} 个国家`;

  tbody.innerHTML = sorted.map(r => {
    const region = r[0], country = r[1], currency = r[2];
    const rate = getRate(currency);
    const prices = r.slice(3,8).map((p,i) => {
      const code = productCodeForOwnModel(MODEL_KEYS[i]);
      if (isNotListedTarget(country, code)) return `<span class="price missing">未上市</span>`;
      const status = ownGapStatus(country, code);
       if (status && (p === '—' || p.startsWith('—'))) return gapStatusHtml(status);
      if (p === '—' || p.startsWith('—')) return `<span class="price missing">${p}</span>`;
      const displayOnlyStatus = r[10] && r[10].displayOnly && r[10].displayOnly[i];
      if (displayOnlyStatus) {
        return p.split(/\s*·\s*/).filter(Boolean).map(v => {
          const variant = splitPriceAndConfiguration(v);
          const display = variant ? formatPriceDisplay(variant.price, currency) : formatPriceDisplay(v, currency);
          const configuration = variant ? `<br><span style="font-size:11px;color:var(--text2);">${formatRamRomDisplay(variant.configuration)}</span>` : '';
          return `<span class="price">${display}</span>${configuration}<br><span style="font-size:11px;color:var(--text2);">${escapeHtmlText(displayOnlyStatus)}</span>`;
        }).join('<div style="margin-top:6px;"></div>');
      }
      const modelName = MODEL_KEYS[i].replace('Redmi ', '');
      // Split variants by " · " or whitespace-separated "/"; preserve currency prefixes such as "S/".
       const variants = country === '罗马尼亚'
         ? p.split(/\s*·\s*(?=\d)|\s+\/\s+/).filter(Boolean)
         : p.split(/\s*·\s*|\s+\/\s+/).filter(Boolean);
       const formatted = variants.map((v, variantIndex) => {
        v = v.trim();
        // Match "price (config)" pattern without altering the raw source text.
         const variant = splitPriceAndConfiguration(v);
         if (variant) {
           const price = variant.price, config = variant.configuration;
           const offerKey = country === '罗马尼亚' && r[10] && r[10].offerKeys
             ? r[10].offerKeys[i]?.[variantIndex]
             : '';
           const sourceSpecification = country === '泰国' ? `${config} (${r[8]})` : config;
           const url = getSourceUrl(country, modelName, sourceSpecification, offerKey);
           const isRange = /-/.test(price);
           const cleanPrice = price.replace(/^(?:S\/|HK\$|CLP\$|Rp|฿|₽)\s*|^~/, '').replace(/,/g, '');
           const priceNum = parseFloat(cleanPrice);
           const usd = isRange ? '—' : isNaN(priceNum) ? '' : formatPriceDisplay(Math.round(priceNum / rate), 'USD');
           const priceText = formatPriceDisplay(price, currency);
           const priceDisplay = url ? priceLink(priceText, url)
             : `<span class="price" style="color:${i===chartModel?MODEL_COLORS[i]:'inherit'}">${priceText}</span>`;
           return `${priceDisplay}<br><span style="font-size:11px;color:var(--text2);">${formatRamRomDisplay(config)} · ${usd}</span>`;
         }
        // Non-matching text (e.g. placeholder, OOS)
           const url = getSourceUrl(country, modelName, '', '');
         const priceText = formatPriceDisplay(v, currency);
         return url ? priceLink(priceText, url) : `<span class="price" style="color:${i===chartModel?MODEL_COLORS[i]:'inherit'}">${priceText}</span>`;
      });
      return formatted.map((f, fi) => fi === 0 ? f : '<div style="margin-top:6px;">'+f+'</div>').join('');
    }).join('</td><td>');
    return `<tr>
      <td><span class="region-badge">${region}</span> ${country}<br><span style="font-size:11px;color:var(--text2);font-weight:400;">📦 ${normalizeChannelLabel(r[8])}</span></td>
      <td>${currency}</td>
      <td style="vertical-align:middle;text-align:center;line-height:1.6;">${prices}</td>
    </tr>`;
  }).join('');
}

    const key = r[0] + '|' + r[1];
    if (!groups[key]) groups[key] = { region: r[0], country: r[1], entries: [] };
    groups[key].entries.push(r);
  });
  const groupList = Object.values(groups).sort((a, b) => {
    const ri = regionOrder.indexOf(a.region) - regionOrder.indexOf(b.region);
    if (ri) return ri;
    return a.country.localeCompare(b.country, 'zh-CN');
  });

  // Determine active categories (those with data in current view)
  const activeCats = SAMSUNG_CATS.filter(cat =>
    groupList.some(g => g.entries.some(e => cat.test(e[2])))
  );

  // Headers (match mainTable style — 国家左对齐，品类列居中对齐)
  let headerHtml = '<tr><th style="text-align:left;">国家</th>';
  activeCats.forEach(cat => { headerHtml += '<th style="text-align:center;">'+cat.label+'</th>'; });
  headerHtml += '</tr>';
  thead.innerHTML = headerHtml;

  // Body (match mainTable row style)
  tbody.innerHTML = groupList.map(g => {
    // Collect unique channels for country sub-label
    const channels = [...new Set(g.entries.map(e => {
      const m = (e[3]||'').match(/\(([^)]+)\)\s*$/);
      return m ? m[1].trim() : '';
    }).map(normalizeChannelLabel).filter(Boolean))];

    let cells = '';
    activeCats.forEach(cat => {
      const matched = g.entries.filter(e => cat.test(e[2]));
      if (matched.length === 0) {
        cells += '<td style="text-align:center;color:var(--text2);font-size:13px;">—</td>';
      } else {
        const content = matched.map(e => {
           const configClean = (e[3]||'').replace(/\s*\([^)]*\)\s*$/, '').trim();
           const currency = getCurrencyForCountry(g.country);
           const url = getSourceUrl(g.country, e[2], e[3], e[11]);
           const priceText = formatPriceDisplay(e[4], currency);
           const priceHtml = url ? priceLink(priceText, url) : `<span class="price">${priceText}</span>`;
           // Same format as mainTable: price on top, config · USD below
           return `<div style="margin:3px 0;">${priceHtml}<br><span style="font-size:11px;color:var(--text2);">${formatRamRomDisplay(configClean)} · ${formatPriceDisplay(e[5], 'USD')}</span></div>`;
        }).join('');
        cells += '<td style="text-align:center;vertical-align:middle;line-height:1.6;">'+content+'</td>';
      }
    });

    // Country cell: same format as mainTable (region badge + country + 📦 channel below)
    const countryCell = '<span class="region-badge">'+g.region+'</span> '+g.country
      + '<br><span style="font-size:11px;color:var(--text2);font-weight:400;">'
      + channels.map(ch=>'📦 '+ch).join(' · ')+'</span>';

    return '<tr>'
      + '<td style="white-space:nowrap;">'+countryCell+'</td>'
      + cells
      + '</tr>';
  }).join('');
}

function toggleCollapse(el) {
  const arrow = el.querySelector('.arrow');
  const body = document.getElementById(el.getAttribute('aria-controls')) || el.nextElementSibling;
  if (!body) return;
  const isOpen = !body.hidden;
  body.hidden = isOpen;
  body.classList.toggle('open', !isOpen);
  el.setAttribute('aria-expanded', String(!isOpen));
  if (arrow) arrow.classList.toggle('open', !isOpen);
}

function formatDisplayAmount(amount) {
  const compact = String(amount).replace(/\s+/g, '');
  const separators = [...compact.matchAll(/[,.]/g)];
  const lastSeparator = separators.at(-1);
  const hasFraction = lastSeparator && compact.length - lastSeparator.index - 1 === 2;
  const integerPart = hasFraction ? compact.slice(0, lastSeparator.index) : compact;
  const fractionPart = hasFraction ? compact.slice(lastSeparator.index + 1) : '';
  const digits = integerPart.replace(/[,.]/g, '');
  if (!/^\d+$/.test(digits) || (fractionPart && !/^\d{2}$/.test(fractionPart))) return String(amount);
  return `${Number(digits).toLocaleString('en-US')}${fractionPart ? `.${fractionPart}` : ''}`;
}

function formatPriceDisplay(value, currency) {
  if (value == null || value === '' || value === '—') return value || '—';
  const text = String(value).trim();
  const numeric = text.match(/^(?:≈|~)?\s*(?:[A-Za-z]{2,4}\s*)?(?:HK\$|CLP\$|MX\$|S\/|Rp|[^\d\s]+)?\s*(\d[\d.,\s]*(?:\s*[–-]\s*\d[\d.,\s]*)?)\s*(?:[A-Za-z]{2,4})?$/);
  if (!numeric) return text;
  const amounts = numeric[1].split(/\s*[–-]\s*/).map(formatDisplayAmount);
  const displayAmount = amounts.join('–');
  const inferredCurrency = text.match(/\b([A-Za-z]{3})\b/)?.[1]?.toUpperCase() || '';
  const displayCurrency = currency || inferredCurrency;
  return displayCurrency === 'USD' ? `≈$${displayAmount}` : displayCurrency ? `${displayCurrency} ${displayAmount}` : displayAmount;
}

function formatRamRomDisplay(value) {
  return String(value || '').replace(/(\d+)\s*(?:GB)?\s*(?:\+|\/)\s*(\d+)\s*(?:GB)?/gi, (_, ram, storage) => `${ram}GB+${storage}GB`);
}

function splitPriceAndConfiguration(value) {
  const text = String(value).trim();
  const parenthesized = text.match(/^(.+?)\s+\(([^)]+)\)$/);
  if (parenthesized) return { price: parenthesized[1], configuration: parenthesized[2] };
  const bare = text.match(/^(.+?)\s+(\d+\s*(?:GB)?\s*(?:\+|\/)\s*\d+\s*GB(?:\s+.*)?)$/i);
  return bare ? { price: bare[1], configuration: bare[2] } : null;
}

function calcDiff(compUsd, ourUsd) {
  if (compUsd === '—' || ourUsd === '—') return { text: '—', type: 'none' };
  const cv = parseFloat((compUsd || '').replace(/[~$USD,\s]/g, ''));
  const ov = parseFloat((ourUsd || '').replace(/[~$USD,\s]/g, ''));
  if (isNaN(cv) || isNaN(ov)) return { text: '—', type: 'none' };
  const d = cv - ov, ad = Math.abs(d);
  if (ad < 1) return { text: '持平', type: 'flat' };
  if (ad <= 5) return { text: `${d > 0 ? '+' : ''}$${d.toFixed(0)} (持平)`, type: 'flat' };
  if (ad < 10) return { text: `${d > 0 ? '+' : ''}$${d.toFixed(0)} (基本持平)`, type: 'flat' };
  if (d > 0) return { text: `+$${ad.toFixed(0)} (我方更便宜)`, type: 'cheaper' };
  return { text: `-$${ad.toFixed(0)} (我方更贵)`, type: 'expensive' };
}

/** 根据当前筛选状态，获取某类型的可选值（级联过滤） */
function getCpOptions(type, filters) {
  let data = buildComparisonRows();
  if (filters.region && filters.region !== '全部') data = data.filter(r => r[0] === filters.region);
  if (filters.country) data = data.filter(r => r[1] === filters.country);
  if (filters.brand && filters.brand !== '全部') data = data.filter(r => (r[2]||'').split(' ')[0] === filters.brand);
  if (filters.comp) data = data.filter(r => r[2] === filters.comp);
  if (filters.our && filters.our !== '全部') data = data.filter(r => r[6] === filters.our);
  switch(type) {
    case 'country': return [...new Set(data.map(r => r[1]).filter(Boolean))].sort();
    case 'brand': return [...new Set(data.map(r => (r[2]||'').split(' ')[0]).filter(Boolean))].sort();
    case 'comp': return [...new Set(data.map(r => r[2]).filter(Boolean))].sort();
    case 'our': return [...new Set(data.map(r => r[6]).filter(Boolean))].sort();
    default: return [];
  }
}

      <div class="meta">${country} · ${model} · 折合 USD</div>
      <div style="color:var(--text2);font-size:12px;margin-top:4px;">当地: ${formatPriceDisplay(p.local, getCurrencyForCountry(country))} · 快照: ${p.date}</div>
      <div class="hint">📈 后续添加更多数据快照后将自动显示价格趋势线<br>计划更新频率: 每周/每两周一次</div>
    </div>`;
    return;
  }

  // Multi-point: SVG line chart
  const W = 800, H = 300, pad = { top: 20, bottom: 35, left: 55, right: 20 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
  const vals = points.map(p => p.usd);
  const minV = Math.min(...vals) * 0.95, maxV = Math.max(...vals) * 1.05, range = maxV - minV || 1;
  const xStep = cw / Math.max(points.length - 1, 1);
  const sx = i => pad.left + i * xStep;
  const sy = v => pad.top + ch - ((v - minV) / range) * ch;

  const pathD = points.map((p, i) => `${i===0?'M':'L'}${sx(i)},${sy(p.usd)}`).join(' ');
  const dots = points.map((p, i) =>
    `<circle cx="${sx(i)}" cy="${sy(p.usd)}" r="4" fill="#2563eb" stroke="#fff" stroke-width="2"/>`
  ).join('');
  const labels = points.map((p, i) =>
    `<text x="${sx(i)}" y="${sy(p.usd)-10}" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">${formatPriceDisplay(p.usd, 'USD')}</text>` +
    `<text x="${sx(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#94a3b8">${p.date.slice(5)}</text>`
  ).join('');
  const yLabels = [];
  for (let i = 0; i <= 5; i++) {
    const v = minV + range * i / 5, y = sy(v);
    yLabels.push(`<text x="${pad.left-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${formatPriceDisplay(Math.round(v), 'USD')}</text>`);
    if (i > 0 && i < 5) yLabels.push(`<line x1="${pad.left}" y1="${y}" x2="${W-pad.right}" y2="${y}" stroke="#e4e6eb" stroke-dasharray="4,4" opacity="0.5"/>`);
  }
  const isDark = document.body.classList.contains('dark');
  const axisColor = isDark ? '#475569' : '#e4e6eb';
  container.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;">
    <rect x="${pad.left}" y="0" width="${cw}" height="${ch+pad.top}" fill="transparent"/>
    ${yLabels.join('')}
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+ch}" stroke="${axisColor}" stroke-width="1"/>
    <line x1="${pad.left}" y1="${pad.top+ch}" x2="${W-pad.right}" y2="${pad.top+ch}" stroke="${axisColor}" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${labels}
    ${dots}
  </svg>`;
}

// ===== PRODUCT-COMP FOLDING VIEW =====
let pcRegion = '全部';
const pcFilter = { brand: '', comp: '', country: '' };
const pcSearch = { comp: '', country: '' };

function getPcOptions(type) {
  let data = buildComparisonRows();
  if (pcRegion !== '全部') data = data.filter(r => r[0] === pcRegion);
  if (pcFilter.brand) data = data.filter(r => (r[2]||'').split(' ')[0] === pcFilter.brand);
  if (pcFilter.comp) data = data.filter(r => r[2] === pcFilter.comp);
  if (pcFilter.country) data = data.filter(r => r[1] === pcFilter.country);
  switch(type) {
    case 'brand': return [...new Set(data.map(r => (r[2]||'').split(' ')[0]).filter(Boolean))].sort();
    case 'comp': return [...new Set(data.map(r => r[2]).filter(Boolean))].sort();
    case 'country': return [...new Set(data.map(r => r[1]).filter(Boolean))].sort();
    default: return [];
  }
}

function renderPcChips(containerId, items, selectedVal, searchQ) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const filtered = searchQ ? items.filter(i => i.toLowerCase().includes(searchQ.toLowerCase())) : items;
  if (selectedVal && !items.includes(selectedVal)) selectedVal = '';
  el.innerHTML = '<button type="button" class="filter-chip all-chip' + (!selectedVal ? ' active' : '') + '" data-pc-v="">全部</button>' +
    filtered.map(i => '<button type="button" class="filter-chip' + (selectedVal === i ? ' active' : '') + '" data-pc-v="' + i.replace(/"/g,'&quot;') + '">' + i + '</button>').join('');
}

function populatePcFilters() {
  const brands = getPcOptions('brand');
  const comps = pcFilter.brand ? getPcOptions('comp') : [];
  const countries = getPcOptions('country');
  renderPcChips('pcBrandChips', brands, pcFilter.brand, '');
  renderPcChips('pcCompChips', comps, pcFilter.comp, pcSearch.comp);
  renderPcChips('pcCountryChips', countries, pcFilter.country, pcSearch.country);
}

function filterPcChips(type) {
  const searchMap = { comp:'pcCompSearch', country:'pcCountrySearch' };

function renderProductCompView() {
  const container = document.getElementById('productCompContainer');
  const statsEl = document.getElementById('pcStatsBar');
  if (!container) return;

  // Filter by region + cascading filters
  let data = buildComparisonRows();
  if (pcRegion !== '全部') data = data.filter(r => r[0] === pcRegion);
  if (pcFilter.brand) data = data.filter(r => (r[2]||'').split(' ')[0] === pcFilter.brand);
  if (pcFilter.comp) data = data.filter(r => r[2] === pcFilter.comp);
  if (pcFilter.country) data = data.filter(r => r[1] === pcFilter.country);

  // Update stat
  const statEl = document.getElementById('pcFilterStat');
  if (statEl) statEl.textContent = `筛选后 ${data.length} / ${buildComparisonRows().length} 条`;

  if (data.length === 0) {
    container.innerHTML = '<div class="empty-state">无匹配竞品价格数据，尝试调整筛选条件</div>';
    if (statsEl) statsEl.textContent = '';
    return;
  }

  // Group by product code
  const byProduct = {};
  // Sort by name length descending so "Note 15 5G" matches before "Note 15"
  const nameEntries = Object.entries(PRODUCT_NAMES).sort((a,b) => b[1].length - a[1].length);
  for (const row of data) {
    const ourModel = row[6];
    let code = null;
    for (const [c, shortName] of nameEntries) {
      if (ourModel.includes(shortName)) { code = c; break; }
    }
    if (!code) {
      if (!byProduct.unmapped) byProduct.unmapped = [];
      byProduct.unmapped.push(row);
      continue;
    }
    if (!byProduct[code]) byProduct[code] = [];
    byProduct[code].push(row);
  }

  const productCount = Object.keys(byProduct).length;
  if (statsEl) statsEl.textContent = `共 ${data.length} 条竞品价格 · ${productCount} 个产品系列`;

  // Build full model name map
  const codeToFull = {};
  for (const code of PRODUCT_CODES) {
    const short = PRODUCT_NAMES[code];
    codeToFull[code] = MODEL_KEYS.find(m => m.includes(short)) || short;
  }

  // Render by product order
  let html = '';
  for (const code of PRODUCT_CODES.concat('unmapped')) {
    const rows = byProduct[code];
    if (!rows || rows.length === 0) continue;
    const fullName = code === 'unmapped' ? '未映射目标' : (codeToFull[code] || PRODUCT_NAMES[code]);
    const shortName = code === 'unmapped' ? '无可用我方目标' : PRODUCT_NAMES[code];

    html += `<div style="margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <button type="button" class="collapse-toggle" aria-controls="pcGroupBody-${code}" aria-expanded="false" style="margin-bottom:0;border-radius:0;border:none;background:var(--surface2);font-weight:600;font-size:14px;" onclick="toggleCollapse(this)">
        <span class="arrow">▶</span>
        ${fullName.replace('REDMI Note 15','Note 15')} <span style="font-size:12px;color:var(--text2);font-weight:400;">(${shortName})</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text2);font-weight:400;">${rows.length} 条竞品</span>
      </button>
      <div class="collapse-body" id="pcGroupBody-${code}" hidden>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>区域</th><th>国家</th><th>竞品</th><th>竞品当地价</th><th>≈USD</th><th>我方当地价</th><th>≈USD</th><th>价差</th></tr>
            </thead>
            <tbody>
              ${rows.map(r => {
                const gapStatus = comparisonGapStatus(r);
                const diff = calcDiff(r[5], r[9]);
                const dc = diff.type === 'cheaper' ? ' style="color:var(--green);font-weight:600;"' : diff.type === 'expensive' ? ' style="color:var(--red);font-weight:600;"' : ' style="color:var(--text2);"';
                const cs = r[3]||''; const cm = cs.match(/\(([^)]+)\)$/);
                const cc = cm ? cm[1].trim() : ''; const csc = cm ? cs.replace(/\s*\([^)]+\)$/,'').trim() : cs;
                const os = r[7]||''; const om = os.match(/\(([^)]+)\)$/);
                const oc = om ? om[1].trim() : ''; const osc = om ? os.replace(/\s*\([^)]+\)$/,'').trim() : os;
                const ch = formatChannelLabels([cc, oc]);
                if (gapStatus) {
                  const channels = formatChannelLabels(String(gapStatus.channel || '').split(';'));
                  return `<tr>
                    <td><span class="region-badge">${r[0]}</span></td>
                    <td style="font-weight:600;">${r[1]}${channels ? `<br><span style="font-size:11px;color:var(--text2);font-weight:400;">📦 ${channels}</span>` : ''}</td>
                    <td>${r[2]}</td>
                    <td>${gapStatusHtml(gapStatus)}<br><span style="color:var(--text2);font-size:11px;">状态覆盖</span></td>
                    <td style="font-size:12px;color:var(--text2);">—</td>
                    <td>${gapStatusHtml(gapStatus)}</td>
                    <td style="font-size:12px;color:var(--text2);">—</td>
                    <td style="color:var(--text2);">—</td>
                  </tr>`;
                }
                const pcUrl = getSourceUrl(r[1], r[2], r[3], r[11]);
                const isDisplayOnly = isMalaysiaNotifyMeDisplayPrice(r);
                const hasOwnPrice = r[8] !== '无已验证自有价';
                const ownSpecDisplay = hasOwnPrice ? osc : '—';
                 const poUrl = isDisplayOnly || !hasOwnPrice ? null : getSourceUrl(r[1], r[6], r[7], r[12]);
                const displayOnlyNote = isDisplayOnly
                  ? '<br><span style="color:var(--text2);font-size:11px;">Notify Me · 不可购买</span>'
                  : '';
                return `<tr>
                  <td><span class="region-badge">${r[0]}</span></td>
                  <td style="font-weight:600;">${r[1]}${ch ? `<br><span style="font-size:11px;color:var(--text2);font-weight:400;">📦 ${ch}</span>` : ''}</td>
                  <td>${r[2]}</td>
                  <td>${priceLink(formatPriceDisplay(r[4], getCurrencyForCountry(r[1])), pcUrl)}<br><span style="color:var(--text2);font-size:11px;">${formatRamRomDisplay(csc)}</span></td>
                  <td style="font-size:12px;color:var(--text2);">${formatPriceDisplay(r[5], 'USD')}</td>
                  <td>${hasOwnPrice ? priceLink(formatPriceDisplay(r[8], getCurrencyForCountry(r[1])), poUrl) : '<span style="color:var(--text2);">无已验证自有价</span>'}<br><span style="color:var(--text2);font-size:11px;">${formatRamRomDisplay(ownSpecDisplay)}</span>${displayOnlyNote}</td>
                  <td style="font-size:12px;color:var(--text2);">${formatPriceDisplay(r[9], 'USD')}</td>
                  <td${dc}>${diff.text}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function setPcRegion(r) {
  pcRegion = r;

  pcFilter.brand = ''; pcFilter.comp = ''; pcFilter.country = '';

// ===== SECTION SWITCHING =====
function switchSection(section) {
  document.querySelectorAll('.section-tab').forEach(t => {
    t.classList.remove('active');
  });
  document.querySelectorAll('.section-tab').forEach(t => {
    const text = t.textContent.trim();
    if(section==='overview' && text.includes('价格')) t.classList.add('active');
    if(section==='competitor' && text.includes('竞品价格')) t.classList.add('active');
    if(section==='history' && text.includes('历史')) t.classList.add('active');
    if(section==='productComp' && text.includes('产品对标')) t.classList.add('active');
  });
  document.getElementById('overviewSection').style.display = section === 'overview' ? '' : 'none';
  document.getElementById('competitorSection').style.display = section === 'competitor' ? '' : 'none';
  document.getElementById('historySection').style.display = section === 'history' ? '' : 'none';
  document.getElementById('productCompSection').style.display = section === 'productComp' ? '' : 'none';
  if(section==='history'){
    renderHistoryRegionTabs();
    populateHistorySelects();
  }
  if(section==='competitor'){
    cpFilter.region = '全部'; cpFilter.country = ''; cpFilter.brand = '全部'; cpFilter.comp = ''; cpFilter.our = '全部';
    populateCpFilters();
    renderCompPriceTable();
    renderCompRegionTabs();
    renderCompProductChips();
    renderCompBrandChips();
    renderCompMapping();
    document.getElementById('compMappingCount').textContent = `(${Object.keys(compMapping[compProduct]||{}).length} 国, ${Object.values(compMapping[compProduct]||{}).flat().length} 竞品条)`;
  }
  if(section==='productComp'){
    renderPcRegionTabs();
    populatePcFilters();
    renderProductCompView();
  }
}

function updateTableScrollAffordance(tableWrap) {
  const remainingScroll = tableWrap.scrollWidth - tableWrap.clientWidth - tableWrap.scrollLeft;
  tableWrap.classList.toggle('has-scroll-right', remainingScroll > 1);
}

let tableScrollAffordanceFrame = 0;
function scheduleTableScrollAffordances() {
  cancelAnimationFrame(tableScrollAffordanceFrame);
  tableScrollAffordanceFrame = requestAnimationFrame(() => {
    document.querySelectorAll('.table-wrap').forEach(updateTableScrollAffordance);
  });
}

  if (cpChip) {
    const val = cpChip.dataset.cpV || '';
    const parent = cpChip.parentElement.id;
    const map = { cpRegionChips:'region', cpCountryChips:'country', cpBrandChips:'brand', cpCompChips:'comp', cpOurChips:'our' };
    const type = map[parent];
    if (!type) return;
    cpFilter[type] = val;
    if (type === 'region') { cpFilter.country = ''; cpFilter.brand = ''; cpFilter.comp = ''; cpFilter.our = ''; }
    else if (type === 'country') { cpFilter.brand = ''; cpFilter.comp = ''; cpFilter.our = ''; }
    else if (type === 'brand') { cpFilter.comp = ''; }
    populateCpFilters();
    renderCompPriceTable();
    return;
  }
  // Product-comp filter chips (品牌→型号 cascade)
  const pcChip = e.target.closest('#pcBrandChips .filter-chip, #pcCompChips .filter-chip, #pcCountryChips .filter-chip');
  if (pcChip) {
    const val = pcChip.dataset.pcV || '';
    const parent = pcChip.parentElement.id;
    const map = { pcBrandChips:'brand', pcCompChips:'comp', pcCountryChips:'country' };
    const type = map[parent];
    if (!type) return;
    pcFilter[type] = val;
    if (type === 'brand') { pcFilter.comp = ''; pcSearch.comp = ''; }

    renderProductCompView();
