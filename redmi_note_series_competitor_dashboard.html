<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redmi Note 15 全球价格看板</title>
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #e4e6eb;
    --text: #1a1a2e;
    --text2: #6b7280;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --accent-light: #eff6ff;
    --green: #059669;
    --red: #dc2626;
    --orange: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 12px;
    --radius-sm: 8px;
  }
  .dark {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --accent: #60a5fa;
    --accent2: #93c5fd;
    --accent-light: #1e293b;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height:1.5;
    transition: background .3s, color .3s;
    padding: 20px;
  }
  .container { max-width:1400px; margin:0 auto; }

  /* Header */
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .header h1 { font-size:24px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .header h1 span { background:var(--accent); color:#fff; font-size:14px; padding:2px 10px; border-radius:20px; font-weight:500; }
  .theme-toggle { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 16px; cursor:pointer; color:var(--text); font-size:14px; }
  .theme-toggle:hover { background:var(--surface2); }

  /* KPI */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:24px; }
  .kpi-card { background:var(--surface); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); }
  .kpi-card .label { font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
  .kpi-card .value { font-size:28px; font-weight:700; margin-top:4px; }
  .kpi-card .sub { font-size:13px; color:var(--text2); margin-top:2px; }

  /* Controls */
  .controls { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .controls .search-wrap { flex:1; min-width:200px; }
  .controls .search-wrap input, .controls .search-wrap select {
    width:100%; padding:8px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:14px; outline:none;
  }
  .controls .search-wrap input:focus, .controls .search-wrap select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .controls .search-wrap select { cursor:pointer; appearance:auto; }
  .region-tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .region-tab {
    padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text2); font-size:13px; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .region-tab:hover { border-color:var(--accent); color:var(--accent); }
  .region-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .model-chips { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px; }
  .model-chip {
    padding:4px 12px; border-radius:16px; border:1px solid var(--border); background:var(--surface);
    color:var(--text2); font-size:12px; cursor:pointer; transition:all .15s;
  }
  .model-chip:hover { border-color:var(--accent); color:var(--accent); }
  .model-chip.active { background:var(--accent-light); color:var(--accent); border-color:var(--accent); font-weight:600; }

  /* Stats bar */
  .stats-bar { font-size:13px; color:var(--text2); margin-bottom:12px; display:flex; gap:16px; flex-wrap:wrap; }

  /* Table */
  .table-wrap { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { background:var(--surface2); font-weight:600; color:var(--text2); font-size:12px; cursor:pointer; user-select:none; position:relative; }
  th:hover { color:var(--text); }
  th .sort-icon { opacity:.3; margin-left:4px; }
  th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity:1; }
  th.sort-asc .sort-icon::after { content:'▲'; font-size:10px; }
  th.sort-desc .sort-icon::after { content:'▼'; font-size:10px; }
  th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content:'↕'; font-size:10px; }
  tr:hover { background:var(--accent-light); }
  td:first-child { font-weight:600; }
  td .region-badge {
    display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px;
    background:var(--accent-light); color:var(--accent); font-weight:500;
  }
  td .price { font-variant-numeric:tabular-nums; }
  td .price.missing { color:var(--text2); font-style:italic; }
  .quality-badge { font-size:11px; padding:1px 8px; border-radius:10px; }
  .quality-badge.full { background:#ecfdf5; color:#059669; }
  .quality-badge.partial { background:#fffbeb; color:#d97706; }
  .quality-badge.limited { background:#fef2f2; color:#dc2626; }

  /* Chart section */
  .chart-section { margin-top:24px; }
  .chart-section h2 { font-size:18px; margin-bottom:12px; }
  .chart-card { background:var(--surface); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }

  /* Competition */
  .comp-section { margin-top:24px; }
  .comp-section h2 { font-size:18px; margin-bottom:12px; }

  /* Footer */
  .footer { margin-top:32px; padding:16px 0; text-align:center; font-size:12px; color:var(--text2); border-top:1px solid var(--border); }

  /* Responsive */
  @media(max-width:768px) {
    body { padding:12px; }
    .header h1 { font-size:18px; }
    .kpi-row { grid-template-columns:repeat(2,1fr); }
  }

  /* Animations */
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .table-wrap, .kpi-card, .chart-card { animation:fadeIn .4s ease; }

  /* Empty state */
  .empty-state { padding:40px; text-align:center; color:var(--text2); font-size:14px; }

  /* Section tabs */
  .section-tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--border); }
  .section-tab {
    padding:10px 20px; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none;
    background:transparent; color:var(--text2); font-size:14px; cursor:pointer; font-weight:500;
    transition:all .15s; position:relative; bottom:-2px;
  }
  .section-tab:hover { color:var(--accent); background:var(--accent-light); }
  .section-tab.active {
    background:var(--surface); color:var(--accent); border-color:var(--border); font-weight:600;
  }
  .section-tab .badge {
    font-size:11px; background:var(--accent-light); color:var(--accent); padding:0 8px; border-radius:10px; margin-left:6px;
  }
  .section-tab.active .badge { background:var(--accent); color:#fff; }

  /* History */
  /* Collapsible */
  .collapse-toggle {
    display:flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--surface); color:var(--text2); font-size:13px;
    cursor:pointer; transition:all .15s; user-select:none; margin-bottom:12px;
  }
  .collapse-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .collapse-toggle .arrow { transition:transform .2s; display:inline-block; font-size:10px; }
  .collapse-toggle .arrow.open { transform:rotate(90deg); }
  .collapse-body { overflow:hidden; transition:max-height .3s ease; max-height:0; }
  .collapse-body.open { max-height:100000px; }

  /* Filter group: chip + search combo */
  .filter-group { display:flex; flex-direction:column; gap:3px; min-width:140px; }
  .filter-group label { font-size:11px; color:var(--text2); font-weight:500; }
  .filter-search {
    padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:12px; outline:none; width:100%; box-sizing:border-box;
  }
  .filter-search:focus { border-color:var(--accent); }
  .filter-chips { display:flex; flex-wrap:wrap; gap:3px; max-height:80px; overflow-y:auto; padding:2px 0; }
  .filter-chip {
    padding:1px 10px; border:1px solid var(--border); border-radius:10px;
    font-size:11px; cursor:pointer; background:var(--surface); color:var(--text2);
    transition:all .12s; white-space:nowrap; user-select:none;
  }
  .filter-chip:hover { border-color:var(--accent); color:var(--accent); }
  .filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filter-chip.all-chip { border-style:dashed; opacity:.7; }
  .filter-chip.all-chip.active { border-style:solid; opacity:1; }

  .comp-filters { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:flex-start; }
  .comp-filters .stat { font-size:12px; color:var(--text2); align-self:center; margin-left:auto; white-space:nowrap; }

  .history-controls { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:flex-start; }
  .history-controls select {
    padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:13px; outline:none; cursor:pointer; min-width:120px;
  }
  .history-controls select:focus { border-color:var(--accent); }
  .trend-chart-wrap { width:100%; overflow-x:auto; padding:10px 0; }
  .trend-single {
    text-align:center; padding:40px 0;
  }
  .trend-single .big-price { font-size:48px; font-weight:700; color:var(--accent); }
  .trend-single .meta { color:var(--text2); margin-top:8px; font-size:14px; }
  .trend-single .hint {
    margin-top:24px; padding:16px; background:var(--accent-light); border-radius:8px;
    color:var(--text2); font-size:13px;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1>Redmi Note 15 全球价格看板 <span>23 国</span></h1>

function getSourceUrl(country, productName) {
  const map = SOURCE_URLS[country];
  if (!map) return '';
  if (map[productName]) return map[productName];
  const noRedmi = productName.replace(/^Redmi\s+/i, '');
  if (map[noRedmi]) return map[noRedmi];
  const normName = noRedmi.toLowerCase();
  for (const key in map) {
    if (key.toLowerCase() === normName) {
      return map[key];
    }
  }
  return '';
}

  if (!url) return price;

}

// Helper: get best USD price for a (country, model) pair
function getUsdPrice(country, modelName){
  const match = detailData.filter(d => d[0]===country && d[1]===modelName);
  if(match.length===0) return null;
  // Pick the row with the lowest price
  let best = match[0];
  for(const m of match){
    const v = parseFloat((m[4].match(/[\d.]+/)||['0'])[0]);
    const bv = parseFloat((best[4].match(/[\d.]+/)||['0'])[0]);
    if(!isNaN(v) && (isNaN(bv) || v < bv)) best = m;
  }
  // Extract first number from strings like "~244~333", "~238", "~203~214"
  const numMatch = best[4].match(/[\d.]+/);
  const usd = numMatch ? parseFloat(numMatch[0]) : NaN;
  return isNaN(usd) ? null : { usd, local: best[3], currency: best[5], config: best[2], usdDisplay: best[4].trim() };
}

function extractBrand(comp) { return comp.split(' ')[0]; }

function renderCompBrandChips() {
  const prod = compMapping[compProduct];
  if(!prod) return;
  const el = document.getElementById('compBrandChips');
  if(!el) return;
  // Count countries per brand
  const brandCounts = {};
  Object.values(prod).forEach(comps => {
    const seen = new Set();
    comps.forEach(c => { const b = extractBrand(c); if(b) seen.add(b); });
    seen.forEach(b => { brandCounts[b] = (brandCounts[b] || 0) + 1; });
  });
  const brands = Object.keys(brandCounts).sort();
  el.innerHTML = `<span style="font-size:12px;color:var(--text2);margin-right:6px;">品牌筛选:</span>
    <div class="model-chip${!compBrand?' active':''}" data-comp-brand="">全部</div>` +
    brands.map(b =>
      `<div class="model-chip${compBrand===b?' active':''}" data-comp-brand="${b}">${b} <span style="opacity:.6;">(${brandCounts[b]})</span></div>`
    ).join('');
}

    const region = regionMap[e.country] || '其他';

}

function renderKPI(){
  const total = summaryData.length;
  const complete = summaryData.filter(r => r[8]==='完整').length;
  const partial = summaryData.filter(r => r[8]==='部分缺失').length;
  const limited = total - complete - partial;
  const html = [
    {label:'覆盖国家', value:total, sub:'9 大区域'},
    {label:'数据完整', value:complete, sub:`${Math.round(complete/total*100)}% 完整率`},
    {label:'部分缺失', value:partial, sub:'部分型号缺价'},
    {label:'待补充', value:limited, sub:'仅限少量数据'}
  ].map(k => `<div class="kpi-card"><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="sub">${k.sub}</div></div>`).join('');
  document.getElementById('kpiRow').innerHTML = html;
}

function getFilteredData(){
  return summaryData.filter(r => {
    if(regionFilter!=='全部' && r[0]!==regionFilter) return false;
    if(countryFilter && r[1]!==countryFilter) return false;
    if(modelFilter>=0 && r[modelFilter+2]==='—') return false;
    return true;
  });
}

function renderTable(){
  const data = getFilteredData();
  const thead = qs('#mainTable thead');
  const tbody = qs('#mainTable tbody');

  const modelHeaders = MODEL_KEYS.map((m,i) => {
    const colIdx = i+2;
    return `<th style="text-align:center;" onclick="sortTable(${colIdx})"${sortCol===colIdx?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}>
      ${m.replace('Redmi Note 15','Note 15')}
      <span class="sort-icon"></span></th>`;
  }).join('');

  thead.innerHTML = `<tr>
    <th style="text-align:left;" onclick="sortTable(0)"${sortCol===0?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}>国家<span class="sort-icon"></span></th>
    <th style="text-align:left;" onclick="sortTable(1)"${sortCol===1?(sortAsc?' class="sort-asc"':' class="sort-desc"'):''}>货币<span class="sort-icon"></span></th>
    ${modelHeaders}
    <th style="text-align:left;">质量</th>
  </tr>`;

  if(data.length===0){
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">无匹配数据</div></td></tr>';
    document.getElementById('statsBar').textContent = '';
    return;
  }

  // sort
  let sorted = [...data];
  if(sortCol>=0){
    const idx = sortCol===0?1 : sortCol===1?2 : sortCol;
    sorted.sort((a,b) => {
      let va = (idx<7 ? a[idx] : a[0]);
      let vb = (idx<7 ? b[idx] : b[0]);
      // numeric attempt
      const na = parseFloat(va.replace(/[^0-9.]/g,''));
      const nb = parseFloat(vb.replace(/[^0-9.]/g,''));
      if(!isNaN(na) && !isNaN(nb)) return sortAsc ? na-nb : nb-na;
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  const qBadge = q => ({
    '完整':'<span class="quality-badge full">完整</span>',
    '部分缺失':'<span class="quality-badge partial">部分</span>',
    '数据有限':'<span class="quality-badge limited">有限</span>'
  })[q]||q;

  document.getElementById('statsBar').textContent = `显示 ${sorted.length} / ${summaryData.length} 个国家`;

    const region = r[0], country = r[1], currency = r[2];

    const prices = r.slice(3,8).map((p,i) => {
      if (p === '—' || p.startsWith('—')) return `<span class="price missing">${p}</span>`;
      const modelName = MODEL_KEYS[i].replace('Redmi ', '');
      // Split variants by " · " or " / "
      const variants = p.split(/\s*[·/]\s*/).filter(Boolean);
      const formatted = variants.map(v => {
        v = v.trim();
        // Match "price (config)" pattern
        const match = v.match(/^([\d,.~]+)\s*\(([^)]+)\)$/);
        if (match) {
          const price = match[1], config = match[2];
          const url = getSourceUrl(country, modelName);
          const cleanPrice = price.replace(/^~/, '').replace(/,/g, '');
          const priceNum = parseFloat(cleanPrice);
          const usd = isNaN(priceNum) ? '' : '≈' + Math.round(priceNum / rate);
          const priceDisplay = url ? priceLink(price, url)
            : `<span class="price" style="color:${i===chartModel?MODEL_COLORS[i]:'inherit'}">${price}</span>`;
          return `${priceDisplay}<br><span style="font-size:11px;color:var(--text2);">${config} · ${usd}</span>`;
        }
        // Non-matching text (e.g. placeholder, OOS)
        const url = getSourceUrl(country, modelName);
        return url ? priceLink(v, url) : `<span class="price" style="color:${i===chartModel?MODEL_COLORS[i]:'inherit'}">${v}</span>`;
      });
      return formatted.map((f, fi) => fi === 0 ? f : '<div style="margin-top:6px;">'+f+'</div>').join('');
    }).join('</td><td>');
    return `<tr>
      <td><span class="region-badge">${region}</span> ${country}<br><span style="font-size:11px;color:var(--text2);font-weight:400;">📦 ${r[8]}</span></td>
      <td>${currency}</td>
      <td style="vertical-align:middle;text-align:center;line-height:1.6;">${prices}</td>
      <td>${qBadge(r[9])}</td>
    </tr>`;
  }).join('');
}

function fmtPrice(s) {
  if (!s || s === '—') return s || '—';
  return s.replace(/([₸₽€$£₩฿₫₹₺₴₪₦₵₡₢₣₤₥₦₧₨₪₫€₭₮₰₱₲₳₴₵₶₷₸₹₺₻₼₾])(\d)/g, '$1 $2')
          .replace(/^(Rp)(\d)/, '$1 $2')
          .replace(/^(S\/)(\d)/, '$1 $2');
}

function calcDiff(compUsd, ourUsd) {
  if (compUsd === '—' || ourUsd === '—') return { text: '—', type: 'none' };
  const cv = parseFloat((compUsd || '').replace(/[~$USD,\s]/g, ''));
  const ov = parseFloat((ourUsd || '').replace(/[~$USD,\s]/g, ''));
  if (isNaN(cv) || isNaN(ov)) return { text: '—', type: 'none' };
  const d = cv - ov, ad = Math.abs(d);
  if (ad < 1) return { text: '持平', type: 'flat' };
  if (ad <= 5) return { text: `${d > 0 ? '+' : ''}$${d.toFixed(0)} (持平)`, type: 'flat' };
  if (ad < 10) return { text: `${d > 0 ? '+' : ''}$${d.toFixed(0)} (基本持平)`, type: 'flat' };
  if (d > 0) return { text: `+$${ad.toFixed(0)} (我方更便宜)`, type: 'cheaper' };
  return { text: `-$${ad.toFixed(0)} (我方更贵)`, type: 'expensive' };
}

/** 根据当前筛选状态，获取某类型的可选值（级联过滤） */
function getCpOptions(type, filters) {
  let data = compData;
  if (filters.region && filters.region !== '全部') data = data.filter(r => r[0] === filters.region);
  if (filters.country) data = data.filter(r => r[1] === filters.country);
  if (filters.brand && filters.brand !== '全部') data = data.filter(r => (r[2]||'').split(' ')[0] === filters.brand);
  if (filters.comp) data = data.filter(r => r[2] === filters.comp);
  if (filters.our && filters.our !== '全部') data = data.filter(r => r[6] === filters.our);
  switch(type) {
    case 'country': return [...new Set(data.map(r => r[1]).filter(Boolean))].sort();
    case 'brand': return [...new Set(data.map(r => (r[2]||'').split(' ')[0]).filter(Boolean))].sort();
    case 'comp': return [...new Set(data.map(r => r[2]).filter(Boolean))].sort();
    case 'our': return [...new Set(data.map(r => r[6]).filter(Boolean))].sort();
    default: return [];
  }
}

function renderHistoryChart() {
  const country = historyCountryFilter || '';
  const model = document.getElementById('historyModel').value;
  const container = document.getElementById('trendChartContainer');
  const empty = document.getElementById('trendEmpty');
  if (!country || !model) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const points = [];
  for (const s of priceHistory) {
    const e = s.entries.find(x => x[0]===country && x[1]===model);
    if (e) {
      const v = parseFloat((e[4].match(/[\d.]+/)||['0'])[0]);
      if (!isNaN(v) && v > 0) points.push({ date: s.date, usd: v, local: e[3] });
    }
  }
  if (points.length === 0) {
    container.innerHTML = `<div class="empty-state">${country} · ${model} 暂无价格数据</div>`;
    return;
  }

  // Single point: show current value + hint
  if (points.length === 1) {
    const p = points[0];
    container.innerHTML = `<div class="trend-single">
      <div class="big-price">~$${p.usd}</div>
      <div class="meta">${country} · ${model} · 折合 USD</div>
      <div style="color:var(--text2);font-size:12px;margin-top:4px;">当地: ${fmtPrice(p.local)} · 快照: ${p.date}</div>
      <div class="hint">📈 后续添加更多数据快照后将自动显示价格趋势线<br>计划更新频率: 每周/每两周一次</div>
    </div>`;
    return;
  }

  // Multi-point: SVG line chart
  const W = 800, H = 300, pad = { top: 20, bottom: 35, left: 55, right: 20 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
  const vals = points.map(p => p.usd);
  const minV = Math.min(...vals) * 0.95, maxV = Math.max(...vals) * 1.05, range = maxV - minV || 1;
  const xStep = cw / Math.max(points.length - 1, 1);
  const sx = i => pad.left + i * xStep;
  const sy = v => pad.top + ch - ((v - minV) / range) * ch;

  const pathD = points.map((p, i) => `${i===0?'M':'L'}${sx(i)},${sy(p.usd)}`).join(' ');
  const dots = points.map((p, i) =>
    `<circle cx="${sx(i)}" cy="${sy(p.usd)}" r="4" fill="#2563eb" stroke="#fff" stroke-width="2"/>`
  ).join('');
  const labels = points.map((p, i) =>
    `<text x="${sx(i)}" y="${sy(p.usd)-10}" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">$${p.usd}</text>` +
    `<text x="${sx(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#94a3b8">${p.date.slice(5)}</text>`
  ).join('');
  const yLabels = [];
  for (let i = 0; i <= 5; i++) {
    const v = minV + range * i / 5, y = sy(v);
    yLabels.push(`<text x="${pad.left-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">$${Math.round(v)}</text>`);
    if (i > 0 && i < 5) yLabels.push(`<line x1="${pad.left}" y1="${y}" x2="${W-pad.right}" y2="${y}" stroke="#e4e6eb" stroke-dasharray="4,4" opacity="0.5"/>`);
  }
  const isDark = document.body.classList.contains('dark');
  const axisColor = isDark ? '#475569' : '#e4e6eb';
  container.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;">
    <rect x="${pad.left}" y="0" width="${cw}" height="${ch+pad.top}" fill="transparent"/>
    ${yLabels.join('')}
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+ch}" stroke="${axisColor}" stroke-width="1"/>
    <line x1="${pad.left}" y1="${pad.top+ch}" x2="${W-pad.right}" y2="${pad.top+ch}" stroke="${axisColor}" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${labels}
    ${dots}
  </svg>`;
}

// ===== PRODUCT-COMP FOLDING VIEW =====
let pcRegion = '全部';
const pcFilter = { brand: '', comp: '', country: '' };
const pcSearch = { comp: '', country: '' };

function getPcOptions(type) {
  let data = compData;
  if (pcRegion !== '全部') data = data.filter(r => r[0] === pcRegion);
  if (pcFilter.brand) data = data.filter(r => (r[2]||'').split(' ')[0] === pcFilter.brand);
  if (pcFilter.comp) data = data.filter(r => r[2] === pcFilter.comp);
  if (pcFilter.country) data = data.filter(r => r[1] === pcFilter.country);
  switch(type) {
    case 'brand': return [...new Set(data.map(r => (r[2]||'').split(' ')[0]).filter(Boolean))].sort();
    case 'comp': return [...new Set(data.map(r => r[2]).filter(Boolean))].sort();
    case 'country': return [...new Set(data.map(r => r[1]).filter(Boolean))].sort();
    default: return [];
  }
}

function renderPcChips(containerId, items, selectedVal, searchQ) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const filtered = searchQ ? items.filter(i => i.toLowerCase().includes(searchQ.toLowerCase())) : items;
  if (selectedVal && !items.includes(selectedVal)) selectedVal = '';
  el.innerHTML = '<div class="filter-chip all-chip' + (!selectedVal ? ' active' : '') + '" data-pc-v="">全部</div>' +
    filtered.map(i => '<div class="filter-chip' + (selectedVal === i ? ' active' : '') + '" data-pc-v="' + i.replace(/"/g,'&quot;') + '">' + i + '</div>').join('');
}

function populatePcFilters() {
  const brands = getPcOptions('brand');
  const comps = pcFilter.brand ? getPcOptions('comp') : [];
  const countries = getPcOptions('country');
  renderPcChips('pcBrandChips', brands, pcFilter.brand, '');
  renderPcChips('pcCompChips', comps, pcFilter.comp, pcSearch.comp);
  renderPcChips('pcCountryChips', countries, pcFilter.country, pcSearch.country);
}

function filterPcChips(type) {
  const searchMap = { comp:'pcCompSearch', country:'pcCountrySearch' };
  const chipMap = { comp:'pcCompChips', country:'pcCountryChips' };
  const q = document.getElementById(searchMap[type]).value;
  pcSearch[type] = q;
  const items = getPcOptions(type);
  renderPcChips(chipMap[type], items, pcFilter[type], q);
}

function togglePcGroup(el) {
  const arrow = el.querySelector('.arrow');
  const body = el.nextElementSibling;
  if (!body) return;
  body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open');
}

function renderPcRegionTabs() {
  const el = document.getElementById('pcRegionTabs');
  if (!el) return;
  const allRegions = ['全部', ...REGIONS.filter(r => r !== '全部')];
  el.innerHTML = allRegions.map(r =>
    `<div class="region-tab${r===pcRegion?' active':''}" data-pc-region="${r}">${r}</div>`
  ).join('');
}

function renderProductCompView() {
  const container = document.getElementById('productCompContainer');
  const statsEl = document.getElementById('pcStatsBar');
  if (!container) return;

  // Filter by region + cascading filters
  let data = compData;
  if (pcRegion !== '全部') data = data.filter(r => r[0] === pcRegion);
  if (pcFilter.brand) data = data.filter(r => (r[2]||'').split(' ')[0] === pcFilter.brand);
  if (pcFilter.comp) data = data.filter(r => r[2] === pcFilter.comp);
  if (pcFilter.country) data = data.filter(r => r[1] === pcFilter.country);

  // Update badge and stat
  const badge = document.getElementById('pcBadge');
  if (badge) badge.textContent = data.length;
  const statEl = document.getElementById('pcFilterStat');
  if (statEl) statEl.textContent = `筛选后 ${data.length} / ${compData.length} 条`;

  if (data.length === 0) {
    container.innerHTML = '<div class="empty-state">无匹配竞品价格数据，尝试调整筛选条件</div>';
    if (statsEl) statsEl.textContent = '';
    return;
  }

  // Group by product code
  const byProduct = {};
  // Sort by name length descending so "Note 15 5G" matches before "Note 15"
  const nameEntries = Object.entries(PRODUCT_NAMES).sort((a,b) => b[1].length - a[1].length);
  for (const row of data) {
    const ourModel = row[6];
    let code = null;
    for (const [c, shortName] of nameEntries) {
      if (ourModel.includes(shortName)) { code = c; break; }
    }
    if (!code) continue;
    if (!byProduct[code]) byProduct[code] = [];
    byProduct[code].push(row);
  }

  const productCount = Object.keys(byProduct).length;
  if (statsEl) statsEl.textContent = `共 ${data.length} 条竞品价格 · ${productCount} 个产品系列`;

  // Build full model name map
  const codeToFull = {};
  for (const code of PRODUCT_CODES) {
    const short = PRODUCT_NAMES[code];
    codeToFull[code] = MODEL_KEYS.find(m => m.includes(short)) || short;
  }

  // Render by product order
  let html = '';
  for (const code of PRODUCT_CODES) {
    const rows = byProduct[code];
    if (!rows || rows.length === 0) continue;
    const fullName = codeToFull[code] || PRODUCT_NAMES[code];

    html += `<div style="margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <div class="collapse-toggle" style="margin-bottom:0;border-radius:0;border:none;background:var(--surface2);font-weight:600;font-size:14px;" onclick="togglePcGroup(this)">
        <span class="arrow open">▶</span>
        ${fullName.replace('Redmi Note 15','Note 15')} <span style="font-size:12px;color:var(--text2);font-weight:400;">(${PRODUCT_NAMES[code]})</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text2);font-weight:400;">${rows.length} 条竞品</span>
      </div>
      <div class="collapse-body open">
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>区域</th><th>国家</th><th>竞品</th><th>竞品当地价</th><th>≈USD</th><th>我方当地价</th><th>≈USD</th><th>价差</th></tr>
            </thead>
            <tbody>
              ${rows.map(r => {
                const diff = calcDiff(r[5], r[9]);
                const dc = diff.type === 'cheaper' ? ' style="color:var(--green);font-weight:600;"' : diff.type === 'expensive' ? ' style="color:var(--red);font-weight:600;"' : ' style="color:var(--text2);"';
                const cs = r[3]||''; const cm = cs.match(/\(([^)]+)\)$/);
                const cc = cm ? cm[1].trim() : ''; const csc = cm ? cs.replace(/\s*\([^)]+\)$/,'').trim() : cs;
                const os = r[7]||''; const om = os.match(/\(([^)]+)\)$/);
                const oc = om ? om[1].trim() : ''; const osc = om ? os.replace(/\s*\([^)]+\)$/,'').trim() : os;
                const ch = [cc, oc].filter(Boolean).join(' / ');
                const pcUrl = getSourceUrl(r[1], r[2]);
                const poUrl = getSourceUrl(r[1], r[6]);
                return `<tr>
                  <td><span class="region-badge">${r[0]}</span></td>
                  <td style="font-weight:600;">${r[1]}${ch ? `<br><span style="font-size:11px;color:var(--text2);font-weight:400;">📦 ${ch}</span>` : ''}</td>
                  <td>${r[2]}</td>
                  <td>${priceLink(fmtPrice(r[4]), pcUrl)}<br><span style="color:var(--text2);font-size:11px;">${csc}</span></td>
                  <td style="font-size:12px;color:var(--text2);">${fmtPrice(r[5])}</td>
                  <td>${priceLink(fmtPrice(r[8]), poUrl)}<br><span style="color:var(--text2);font-size:11px;">${osc}</span></td>
                  <td style="font-size:12px;color:var(--text2);">${fmtPrice(r[9])}</td>
                  <td${dc}>${diff.text}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function setPcRegion(r) {
  pcRegion = r;
  // Reset cascading filters when region changes
  pcFilter.brand = ''; pcFilter.comp = ''; pcFilter.country = '';
  pcSearch.comp = ''; pcSearch.country = '';
  renderPcRegionTabs();
  populatePcFilters();
  renderProductCompView();
}

// ===== SECTION SWITCHING =====
function switchSection(section) {
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section-tab').forEach(t => {
    const text = t.textContent.trim();
    if(section==='overview' && text.includes('价格')) t.classList.add('active');
    if(section==='competitor' && text.includes('竞品价格')) t.classList.add('active');
    if(section==='history' && text.includes('历史')) t.classList.add('active');
    if(section==='productComp' && text.includes('产品对标')) t.classList.add('active');
  });
  document.getElementById('overviewSection').style.display = section === 'overview' ? '' : 'none';
  document.getElementById('competitorSection').style.display = section === 'competitor' ? '' : 'none';
  document.getElementById('historySection').style.display = section === 'history' ? '' : 'none';
  document.getElementById('productCompSection').style.display = section === 'productComp' ? '' : 'none';
  if(section==='history'){
    renderHistoryRegionTabs();
    populateHistorySelects();
  }
  if(section==='competitor'){
    document.getElementById('compTotalBadge').textContent = compData.length;
    cpFilter.region = '全部'; cpFilter.country = ''; cpFilter.brand = '全部'; cpFilter.comp = ''; cpFilter.our = '全部';
    populateCpFilters();
    renderCompPriceTable();
    renderCompRegionTabs();
    renderCompProductChips();
    renderCompBrandChips();
    renderCompMapping();
    document.getElementById('compMappingCount').textContent = `(${Object.keys(compMapping[compProduct]||{}).length} 国, ${Object.values(compMapping[compProduct]||{}).flat().length} 竞品条)`;
  }
  if(section==='productComp'){
    renderPcRegionTabs();
    populatePcFilters();
    renderProductCompView();
  }
}

// Unified filter chip click handler (竞品价格 + 历史国家)
document.addEventListener('click', e => {
  // History country chips
  const hcChip = e.target.closest('#historyCountryChips .filter-chip');
  if (hcChip) {
    historyCountryFilter = hcChip.dataset.hcV || '';
    document.getElementById('trendChartContainer').innerHTML = '';
    document.getElementById('trendEmpty').style.display = 'block';
    document.getElementById('historyModel').value = '';
    populateHistoryCountryChips(document.getElementById('historyCountrySearch').value);
    renderHistoryChart();
    return;
  }
  // Competitor price filter chips
  const cpChip = e.target.closest('#cpRegionChips .filter-chip, #cpCountryChips .filter-chip, #cpBrandChips .filter-chip, #cpCompChips .filter-chip, #cpOurChips .filter-chip');
  if (cpChip) {
    const val = cpChip.dataset.cpV || '';
    const parent = cpChip.parentElement.id;
    const map = { cpRegionChips:'region', cpCountryChips:'country', cpBrandChips:'brand', cpCompChips:'comp', cpOurChips:'our' };
    const type = map[parent];
    if (!type) return;
    cpFilter[type] = val;
    if (type === 'region') { cpFilter.country = ''; cpFilter.brand = ''; cpFilter.comp = ''; cpFilter.our = ''; }
    else if (type === 'country') { cpFilter.brand = ''; cpFilter.comp = ''; cpFilter.our = ''; }
    else if (type === 'brand') { cpFilter.comp = ''; }
    populateCpFilters();
    renderCompPriceTable();
    return;
  }
  // Product-comp filter chips (品牌→型号 cascade)
  const pcChip = e.target.closest('#pcBrandChips .filter-chip, #pcCompChips .filter-chip, #pcCountryChips .filter-chip');
  if (pcChip) {
    const val = pcChip.dataset.pcV || '';
    const parent = pcChip.parentElement.id;
    const map = { pcBrandChips:'brand', pcCompChips:'comp', pcCountryChips:'country' };
    const type = map[parent];
    if (!type) return;
    pcFilter[type] = val;
    if (type === 'brand') { pcFilter.comp = ''; pcSearch.comp = ''; }
    populatePcFilters();
    renderProductCompView();
    return;
  }
});

// Competitor product & brand selector
document.addEventListener('click', e => {
  const prodChip = e.target.closest('[data-comp-prod]');
  if(prodChip) {
    compProduct = prodChip.dataset.compProd;
    compBrand = '';
    renderCompProductChips();
    renderCompBrandChips();
    renderCompMapping();
    const cnt = document.getElementById('compMappingCount');
    if (cnt) cnt.textContent = '(' + Object.keys(compMapping[compProduct]||{}).length + ' 国, ' + Object.values(compMapping[compProduct]||{}).flat().length + ' 竞品条)';
    return;
  }
  const brandChip = e.target.closest('[data-comp-brand]');
  if(brandChip) {
    compBrand = brandChip.dataset.compBrand || '';
    renderCompBrandChips();
    renderCompMapping();
    return;
  }
  const compRegChip = e.target.closest('[data-comp-region]');
  if(compRegChip) {
    setCompRegion(compRegChip.dataset.compRegion);
    return;
  }
  const histRegChip = e.target.closest('[data-history-region]');
  if(histRegChip) {
    setHistoryRegion(histRegChip.dataset.historyRegion);
    return;
  }
  const pcRegChip = e.target.closest('[data-pc-region]');
  if(pcRegChip) {
    setPcRegion(pcRegChip.dataset.pcRegion);
    return;
  }
});
